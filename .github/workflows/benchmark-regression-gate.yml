name: Anima Benchmark Regression Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare-baseline-and-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request candidate
        uses: actions/checkout@v4

      - name: Check out pull request base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run baseline benchmark
        working-directory: baseline
        run: |
          python benchmark.py || test -f benchmark-results.json
          test -s benchmark-results.json

      - name: Run candidate benchmark
        run: |
          python benchmark.py || test -f benchmark-results.json
          test -s benchmark-results.json

      - name: Generate reviewable improvement proposals
        if: always() && hashFiles('benchmark-results.json') != ''
        run: python improvement_proposal.py benchmark-results.json --json-output improvement-proposals.json --markdown-output improvement-proposals.md

      - name: Compare baseline and candidate reports
        run: |
          python benchmark_gate.py baseline/benchmark-results.json benchmark-results.json --output benchmark-gate-report.json

      - name: Upload comparison report
        if: always() && hashFiles('benchmark-gate-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: anima-benchmark-gate-report
          path: benchmark-gate-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload improvement proposal queue
        if: always() && hashFiles('improvement-proposals.json', 'improvement-proposals.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: anima-improvement-proposals
          path: |
            improvement-proposals.json
            improvement-proposals.md
          if-no-files-found: error
          retention-days: 30
