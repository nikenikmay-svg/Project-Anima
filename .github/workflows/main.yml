name: Anima Background Checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get Anima code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile anima.py test_anima.py benchmark.py reasoning.py reasoning_pipeline.py reasoning_indicator_benchmark.py reasoning_audit.py reasoning_audit_benchmark.py evaluate_summary.py test_reasoning_audit.py test_evaluate_summary.py test_compare_annotations.py review_feedback.py test_review_feedback.py benchmark_gate.py test_benchmark_gate.py improvement_proposal.py test_improvement_proposal.py controlled_experiment.py test_controlled_experiment.py experiment_ledger.py test_experiment_ledger.py test_annotation_template.py test_reasoning.py test_reasoning_pipeline.py test_reasoning_indicator_benchmark.py structured_arguments.py test_structured_arguments.py argument_review.py test_argument_review.py argument_review_summary.py test_argument_review_summary.py argument_review_cli.py test_argument_review_cli.py argument_review_markdown.py test_argument_review_markdown.py verify_review_bundle.py test_verify_review_bundle.py

      - name: Run evaluation regression tests
        run: python -m unittest discover -v

      - name: Run criterion evaluation benchmark
        run: python benchmark.py

      - name: Run reasoning-indicator benchmark
        run: python reasoning_indicator_benchmark.py

      - name: Run claim-audit prototype smoke tests
        run: python reasoning_audit_benchmark.py

      - name: Build layered evaluation summary
        run: python evaluate_summary.py

      - name: Build and verify sample review bundle
        run: |
          python argument_review_cli.py argument_review_example.json --format bundle --output ci-review-bundle
          python verify_review_bundle.py ci-review-bundle

      - name: Upload sample review bundle
        uses: actions/upload-artifact@v4
        with:
          name: anima-sample-review-bundle
          path: |
            ci-review-bundle.json
            ci-review-bundle.md
            ci-review-bundle.manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: anima-benchmark-results
          path: |
            benchmark-results.json
            reasoning-indicator-benchmark-results.json
            reasoning-audit-report.json
            anima-evaluation-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Report status
        run: echo "Anima syntax, regression tests, benchmarks, claim-audit smoke tests, and layered summary completed successfully."
