name: Anima Background Checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get Anima code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile anima.py test_anima.py benchmark.py reasoning.py reasoning_pipeline.py reasoning_indicator_benchmark.py test_reasoning.py test_reasoning_pipeline.py test_reasoning_indicator_benchmark.py

      - name: Run evaluation regression tests
        run: python -m unittest discover -v

      - name: Run criterion evaluation benchmark
        run: python benchmark.py

      - name: Run reasoning-indicator benchmark
        run: python reasoning_indicator_benchmark.py

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: anima-benchmark-results
          path: |
            benchmark-results.json
            reasoning-indicator-benchmark-results.json
          if-no-files-found: error
          retention-days: 30

      - name: Report status
        run: echo "Anima syntax, regression tests, and benchmark completed successfully."
