name: Anima Internet Roaming
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: write
concurrency:
  group: anima-internet-roaming
  cancel-in-progress: false
jobs:
  roam:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public research metadata
        run: python anima_roamer.py
      - name: Save research log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_log/
          if git diff --cached --quiet; then
            echo "No new report changes to save."
          else
            git commit -m "Anima: save scheduled internet research report"
            git push
          fi
