name: Anima Internet Roaming
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: write
concurrency:
  group: anima-internet-roaming
  cancel-in-progress: false
jobs:
  roam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect expanded public research and open-source agent metadata
        run: python anima_roamer.py
      - name: Reflect on collected findings
        run: python anima_reflector.py
      - name: Compare sources and draft test ideas
        run: python anima_compare.py
      - name: Prepare structured agent exchange packet
        run: python anima_agent_exchange.py
      - name: Contact configured peer agent (optional)
        continue-on-error: true
        env:
          ANIMA_AGENT_BASE_URL: ${{ secrets.ANIMA_AGENT_BASE_URL }}
          ANIMA_AGENT_API_KEY: ${{ secrets.ANIMA_AGENT_API_KEY }}
          ANIMA_AGENT_MODEL: ${{ secrets.ANIMA_AGENT_MODEL }}
        run: python anima_agent_connector.py
      - name: Run automatic AQE pilot smoke test
        run: python anima_aqe_pilot.py
      - name: Run fixed AQE benchmark diagnostic
        run: python anima_aqe_benchmark.py
      - name: Install optional semantic embedding dependency
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check fastembed
      - name: Compare lexical and semantic similarity
        run: python anima_semantic_compare.py
      - name: Run experimental evidence-grounding checklist
        run: python anima_evidence_grounding.py
      - name: Save research, reflection, comparison, AQE reports, and agent exchange logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_log/
          if [ -d agent_exchange/inbox ]; then git add agent_exchange/inbox/; fi
          if git diff --cached --quiet; then
            echo "No new report changes to save."
          else
            git commit -m "Anima: save research, reflection, and comparison reports"
            git push
          fi
