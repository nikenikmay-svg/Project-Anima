<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anima — Avatar</title>
<style>
:root{color-scheme:light;--ink:#30243c;--purple:#76508f;--soft:#f5eff9;--lav:#e9dcf2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#fbf8fd,#eee5f4);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
main{width:min(100%,440px);padding:26px 24px 30px;text-align:center;background:#fff;border:1px solid #e9deef;border-radius:28px;box-shadow:0 18px 55px #4c31521a}
.avatar{width:min(78vw,310px);height:auto;display:block;margin:0 auto 12px}
h1{font-size:2rem;line-height:1.1;margin:8px 0;color:#503866}p{margin:8px 0;color:#675b70}.status{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;margin-top:12px;background:var(--soft);border-radius:999px;font-size:.9rem}.dot{width:9px;height:9px;border-radius:50%;background:#55a879}
.note{font-size:.78rem;color:#8b8092;margin-top:20px}
</style>
</head>
<body>
<main>
<svg class="avatar" viewBox="0 0 320 340" role="img" aria-labelledby="avatarTitle avatarDesc" xmlns="http://www.w3.org/2000/svg">

<linearGradient id="hair" x2="1" y2="1"><stop stop-color="#684333"/><stop offset="1" stop-color="#281b1b"/></linearGradient>
<linearGradient id="skin" x2="0" y2="1"><stop stop-color="#ffd0a1"/><stop offset="1" stop-color="#f1a66e"/></linearGradient>
<linearGradient id="shirt" x2="0" y2="1"><stop stop-color="#936db0"/><stop offset="1" stop-color="#604079"/></linearGradient>
</defs>
<!-- shoulders and sweater -->
<path d="M34 328 Q48 259 112 248 L208 248 Q274 259 288 328Z" fill="url(#shirt)" stroke="#30232d" stroke-width="5"/>
<path d="M111 251 Q160 287 209 251" fill="none" stroke="#3b2b42" stroke-width="5"/>

<path d="M91 116 Q93 53 160 51 Q229 51 231 121 L220 206 Q208 258 160 266 Q112 259 99 207Z" fill="url(#skin)" stroke="#33252a" stroke-width="4"/>
<!-- hair fringe and sides -->
<path d="M76 138 Q68 55 132 31 Q183 10 225 50 Q244 69 246 119 Q214 105 196 75 Q158 112 91 115 L83 196 Q65 189 76 138Z" fill="url(#hair)" stroke="#291e20" stroke-width="4"/>

<path d="M86 147 Q71 196 88 245 Q98 265 112 267" fill="none" stroke="#382426" stroke-width="13" stroke-linecap="round"/>
<path d="M235 143 Q251 200 232 246 Q224 262 210 267" fill="none" stroke="#382426" stroke-width="13" stroke-linecap="round"/>
<!-- brows -->
<path d="M111 137 Q130 123 147 136 M175 136 Q194 123 211 138" fill="none" stroke="#39262a" stroke-width="7" stroke-linecap="round"/>
<!-- eyes -->
<ellipse cx="130" cy="158" rx="17" ry="21" fill="#fff"/><ellipse cx="192" cy="158" rx="17" ry="21" fill="#fff"/>
<ellipse cx="133" cy="160" rx="9" ry="14" fill="#302126"/><ellipse cx="189" cy="160" rx="9" ry="14" fill="#302126"/>
<circle cx="136" cy="153" r="4" fill="#fff"/><circle cx="192" cy="153" r="4" fill="#fff"/>
<!-- nose, blush, smile -->
<path d="M159 166 Q151 181 160 184" fill="none" stroke="#c47b55" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="111" cy="190" rx="13" ry="6" fill="#e98f82" opacity=".45"/><ellipse cx="209" cy="190" rx="13" ry="6" fill="#e98f82" opacity=".45"/>
<path d="M132 202 Q160 229 188 202 Q184 238 160 239 Q137 236 132 202Z" fill="#642b32" stroke="#3a2429" stroke-width="3"/>
<path d="M138 207 Q160 215 182 207 Q177 220 160 220 Q144 219 138 207Z" fill="#fff"/>
<path d="M147 231 Q160 238 174 230" fill="none" stroke="#ef8c8d" stroke-width="4" stroke-linecap="round"/>
</svg>
<h1>Anima</h1>
<p>A curious mind, with a friendly face.</p>
<div class="status"><span class="dot"></span> Avatar preview</div>

</main>
</body>
</html>
